name: "Foundation 4 Candidate Integration"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-core:
    name: "Foundation 4 candidate / PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Verify candidate Composer metadata and resolve Foundation branch
        run: |
          set -euo pipefail
          composer validate --strict
          composer update --no-interaction --prefer-dist --no-progress
          php -r '
            require "vendor/autoload.php";
            $version = Composer\InstalledVersions::getPrettyVersion("infocyph/foundation") ?? "";
            if (!str_starts_with($version, "dev-feature/foundation-3")) {
                fwrite(STDERR, "Unexpected Foundation candidate: " . $version . PHP_EOL);
                exit(1);
            }
          '
      - name: Verify Foundation 4 schema-v2 Core module inventory
        run: |
          set -euo pipefail
          php infbyte module:list --json=1 | php -r '
            $response = json_decode(stream_get_contents(STDIN), true, flags: JSON_THROW_ON_ERROR);
            $modules = $response["modules"] ?? [];
            $names = array_column($modules, "name");
            $count = array_sum(array_map(static fn(array $group): int => count($group["features"] ?? []), $modules));
            if (($response["schema_version"] ?? null) !== 2
                || $names !== ["data", "security", "execution"]
                || $count !== 8
            ) {
                fwrite(STDERR, "Foundation 4 module inventory is incompatible." . PHP_EOL);
                exit(1);
            }
          '
      - name: Prepare application and compile one trusted Core release
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_CAPABILITIES: ""
        run: |
          set -euo pipefail
          php infbyte app:install
          php infbyte config:validate --production
          php infbyte optimize --json=1 > /tmp/infbyte-release.json
          php infbyte app:ready
          php -r '
            $data = json_decode(file_get_contents("/tmp/infbyte-release.json"), true, flags: JSON_THROW_ON_ERROR);
            $sha = $data["manifest_sha256"] ?? "";
            if (!is_string($sha) || preg_match("/^[a-f0-9]{64}$/D", $sha) !== 1
                || !is_string($data["generation"] ?? null)
            ) {
                fwrite(STDERR, "Trusted Foundation release metadata is incomplete." . PHP_EOL);
                exit(1);
            }
          '
      - name: Run configured PHPForge CI (no suppressed failures)
        run: composer ic:ci
