name: "Foundation 3 Handoff"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "infbyte-3/foundation-3-handoff" ]

jobs:
  handoff:
    name: "PHP ${{ matrix.php }} - ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        dependencies: ["prefer-lowest", "prefer-stable"]

    steps:
      - name: Checkout InfByte
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pcntl
          tools: composer:v2
          coverage: none

      - name: Install exact Foundation 3 handoff graph
        shell: bash
        run: |
          composer update --no-interaction --prefer-dist --no-progress --${{ matrix.dependencies }}

      - name: Run PHPForge handoff quality suite
        shell: bash
        env:
          COMPOSER_NO_AUDIT: "1"
          IC_PEST_FAIL_ON_SKIPPED: "true"
          IC_PHPSTAN_MEMORY_LIMIT: "1G"
          IC_TEST_TASK_TIMEOUT: "300"
        run: |
          args=(--without-analysis)
          if [ "${{ matrix.dependencies }}" = "prefer-lowest" ]; then
            args+=(--prefer-lowest)
          fi
          composer ic:ci "${args[@]}"
