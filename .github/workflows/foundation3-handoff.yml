name: "Foundation 3 Pre-Tag Handoff"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "foundation-3/runtime-lifecycle" ]

jobs:
  handoff:
    name: "PHP ${{ matrix.php }} - ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        dependencies: ["prefer-lowest", "prefer-stable"]

    steps:
      - name: Checkout InfByte
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pcntl
          tools: composer:v2
          coverage: none

      - name: Install Foundation 3 candidate graph
        shell: bash
        run: |
          composer validate --strict
          composer update --no-interaction --prefer-dist --no-progress --${{ matrix.dependencies }}

      - name: Run PHPForge handoff quality
        shell: bash
        env:
          COMPOSER_NO_AUDIT: "1"
          IC_PEST_FAIL_ON_SKIPPED: "true"
          IC_PHPSTAN_MEMORY_LIMIT: "1G"
          IC_TEST_TASK_TIMEOUT: "300"
        run: |
          args=()
          if [ "${{ matrix.dependencies }}" = "prefer-lowest" ]; then
            args+=(--prefer-lowest)
          fi
          composer ic:ci "${args[@]}"

      - name: Explain pre-tag release-constraint exception
        shell: bash
        run: |
          printf '%s\n'             'This integration workflow intentionally does not run ic:release:constraints.'             'The committed Foundation dependency is a development branch only until Foundation 3 is tagged.'             'Before merging this PR, switch the dependency to ^3.0, remove this temporary workflow, and require the standard Security & Standards matrix to pass.'
