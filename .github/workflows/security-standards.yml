name: "Security & Standards"

# This is the release boundary, not the PR candidate lane. Candidate checks
# live in foundation4-candidate.yml and run on every PR. This workflow must
# reject development branches or VCS overrides before any release qualification.
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [published-core, published-database]
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  stable-constraint:
    name: "Reject non-stable Foundation or VCS overrides"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the published Foundation 4 release constraint
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $manifest=json_decode(file_get_contents("composer.json"),true,flags:JSON_THROW_ON_ERROR);
            if (($manifest["require"]["infocyph/foundation"] ?? null)!=="^4.0"
                || isset($manifest["repositories"])
            ) {
                fwrite(STDERR, "Refusing release: require stable Foundation ^4.0 with normal Composer resolution, without custom repositories." . PHP_EOL);
                exit(1);
            }
          '

  phpforge:
    needs: stable-constraint
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      php_versions: '["8.4","8.5"]'
      dependency_versions: '["prefer-lowest","prefer-stable"]'
      php_extensions: "pcntl,pdo_sqlite"
      fail_on_skipped_tests: true
      run_clean_install: true
      integration_services: '[]'
      service_topologies: '{}'
    permissions:
      security-events: write
      actions: read
      contents: read

  published-core:
    name: "Published Core-only archive and immutable release / PHP ${{ matrix.php }}"
    needs: phpforge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4","8.5"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install exported skeleton without dev dependencies or historical artifacts
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          composer archive --format=tar --dir="$work" --file=infbyte
          mkdir "$work/project"
          tar -xf "$work/infbyte.tar" -C "$work/project"
          cd "$work/project"
          test ! -d docs/plans
          test ! -d .github
          test ! -e composer.lock
          test ! -d vendor
          test -f config/modules.php
          composer update --no-dev --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs --no-dev
          php -r '
            require "vendor/autoload.php";
            $version=Composer\InstalledVersions::getVersion("infocyph/foundation") ?? "";
            if (preg_match("/^4\\.[0-9]+\\.[0-9]+\\.[0-9]+$/D", $version) !== 1) {
                fwrite(STDERR, "A published Foundation 4 release was not installed: " . $version . PHP_EOL);
                exit(1);
            }
          '
          php infbyte app:install
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte config:validate --production
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize --json=1 > "$work/release.json"
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte app:ready
          php -r '
            $release=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR);
            if (!is_string($release["generation"] ?? null)
                || !is_string($release["manifest"] ?? null)
                || !is_file($release["manifest"])
                || !hash_equals($release["manifest_sha256"],hash_file("sha256",$release["manifest"]))
            ) {
                fwrite(STDERR,"Published Foundation generation is not trusted." . PHP_EOL);
                exit(1);
            }
          ' "$work/release.json"

  published-database:
    name: "Published DBLayer optional no-dev integration"
    needs: published-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install and explicitly activate published DBLayer feature
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          composer archive --format=tar --dir="$work" --file=infbyte
          mkdir "$work/project"
          tar -xf "$work/infbyte.tar" -C "$work/project"
          cd "$work/project"
          composer update --no-dev --no-interaction --prefer-dist --no-progress
          php infbyte app:install
          php infbyte module:install data.database --json=1 > "$work/install.json"
          php infbyte module:enable data.database --json=1
          php -r '
            $features=(require "config/modules.php")["features"] ?? [];
            if (($features["data.database"] ?? null)!==true) exit(1);
          '
          composer check-platform-reqs --no-dev
          php infbyte module:disable data.database --json=1
          php infbyte module:remove data.database --json=1
          test -f config/database.php
