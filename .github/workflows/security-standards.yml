name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      php_versions: '["8.4","8.5"]'
      dependency_versions: '["prefer-lowest","prefer-stable"]'
      php_extensions: "pcntl"
      fail_on_skipped_tests: true
      run_clean_install: true
      integration_services: '[]'
      service_topologies: '{}'
    permissions:
      security-events: write
      actions: read
      contents: read

  released-consumer:
    name: "Released consumer - PHP ${{ matrix.php }}"
    needs: phpforge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Verify exported stable Foundation 3 consumer
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            chmod -R u+w "$work" 2>/dev/null || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          composer archive --format=tar --dir="$work" --file=infbyte
          mkdir "$work/project"
          tar -xf "$work/infbyte.tar" -C "$work/project"
          cd "$work/project"

          test ! -e plan.md
          test ! -d .github

          composer install --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative
          composer check-platform-reqs --no-dev
          php infbyte app:install

          APP_ENV=local APP_CAPABILITIES=auth php <<'PHP'
          <?php

          declare(strict_types=1);

          use Infocyph\Foundation\Auth\AuthServices;
          use Infocyph\Foundation\Auth\Authentication\Login\LoginRequest;
          use Infocyph\Foundation\Foundation;

          require 'vendor/autoload.php';

          $app = Foundation::web([
              'base_path' => getcwd(),
              '_config_cache' => false,
          ])->boot();
          $auth = $app->make(AuthServices::class);
          $password = 'infbyte-auth-smoke-secret';
          $hash = $auth->passwordHasher()->hash($password);
          $created = $auth->accounts()->create('auth-smoke@example.test', $hash);
          $account = $created->account;

          if (!$created->successful() || $account === null) {
              fwrite(STDERR, "Dependency-light account creation failed.\n");
              exit(1);
          }

          $result = $auth->authenticator()->login(new LoginRequest(
              $account->identifier(),
              $password,
          ));

          if (!$result->successful() || $result->principal === null || $result->session === null) {
              fwrite(STDERR, "Dependency-light auth smoke failed.\n");
              exit(1);
          }
          PHP

          set +e
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES=auth \
            php infbyte config:validate --production >"$work/auth-production-guard.log" 2>&1
          auth_guard_status=$?
          set -e
          if [[ "$auth_guard_status" -eq 0 ]]; then
            cat "$work/auth-production-guard.log" >&2
            echo "Production auth unexpectedly accepted dependency-light development defaults." >&2
            exit 1
          fi

          auth_token_secret="$(grep '^AUTH_TOKEN_SECRET=' .env | cut -d= -f2-)"
          if [[ -n "$auth_token_secret" ]] && grep -Fq "$auth_token_secret" "$work/auth-production-guard.log"; then
            cat "$work/auth-production-guard.log" >&2
            echo "Production validation leaked AUTH_TOKEN_SECRET." >&2
            exit 1
          fi

          foundation_version="$(php -r 'require "vendor/autoload.php"; echo Composer\InstalledVersions::getPrettyVersion("infocyph/foundation") ?? "";')"
          if [[ -z "$foundation_version" || "$foundation_version" == dev-* ]]; then
            printf 'Expected stable Foundation 3, got: %s\n' "$foundation_version" >&2
            exit 1
          fi

          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte config:validate --production
          first_release_json="$(APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize --json=1)"
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte app:ready

          release_root="$(printf '%s' "$first_release_json" | php -r '$r=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $r["release_root"] ?? "";')"
          first_generation="$(printf '%s' "$first_release_json" | php -r '$r=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $r["generation"] ?? "";')"

          test -n "$release_root"
          test -n "$first_generation"

          second_release_json="$(APP_NAME=InfbyteReplacement APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize --json=1)"
          generation="$(printf '%s' "$second_release_json" | php -r '$r=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $r["generation"] ?? "";')"
          manifest_sha="$(printf '%s' "$second_release_json" | php -r '$r=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $r["manifest_sha256"] ?? "";')"

          test -n "$generation"
          test "$generation" != "$first_generation"
          test -d "$release_root/generations/$first_generation"
          [[ "$manifest_sha" =~ ^[a-f0-9]{64}$ ]]

          cp routes/api.php "$work/api.php"
          printf '%s\n' '<?php throw new RuntimeException("Deliberate release-build failure.");' > routes/api.php
          set +e
          APP_NAME=BrokenRelease APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= \
            php infbyte optimize --json=1 >"$work/failed-build.log" 2>&1
          failed_build_status=$?
          set -e
          mv "$work/api.php" routes/api.php
          if [[ "$failed_build_status" -eq 0 ]]; then
            cat "$work/failed-build.log" >&2
            echo "Deliberately broken release build unexpectedly succeeded." >&2
            exit 1
          fi

          active_generation="$(APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize:report --json=1 | php -r '$r=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $r["generation"] ?? "";')"
          test "$active_generation" = "$generation"

          wrong_sha="$(printf '0%.0s' {1..64})"
          set +e
          INFOCYPH_FOUNDATION_RELEASE_ROOT="$release_root" \
          INFOCYPH_FOUNDATION_RELEASE_MANIFEST_SHA256="$wrong_sha" \
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= \
            php public/index.php >"$work/wrong-trust.log" 2>&1
          wrong_status=$?
          set -e
          if [[ "$wrong_status" -eq 0 ]]; then
            cat "$work/wrong-trust.log" >&2
            echo "Production entrypoint accepted an invalid release manifest digest." >&2
            exit 1
          fi

          chmod -R a-w app bootstrap config public routes

          port=18080
          INFOCYPH_FOUNDATION_RELEASE_ROOT="$release_root" \
          INFOCYPH_FOUNDATION_RELEASE_MANIFEST_SHA256="$manifest_sha" \
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= \
            php -S "127.0.0.1:$port" -t public public/index.php >"$work/server.log" 2>&1 &
          server_pid=$!

          response=""
          for attempt in {1..40}; do
            if response="$(curl --fail --silent "http://127.0.0.1:$port/api/health" 2>/dev/null)"; then
              break
            fi
            sleep 0.25
          done

          if [[ "$response" != *'"status":"ok"'* ]]; then
            cat "$work/server.log" >&2
            printf 'Unexpected health response: %s\n' "$response" >&2
            exit 1
          fi

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          server_pid=""

          php infbyte module:plan database --json=1 >"$work/database-plan.json"
          grep -q '"infocyph/dblayer"' "$work/database-plan.json"

          APP_CAPABILITIES=cache php infbyte cache:schema:status --json=1 >"$work/cache-schema.json"
          grep -q '"schemas"' "$work/cache-schema.json"

          if php infbyte module:show cache --json=1 >"$work/cache-module.log" 2>&1; then
            cat "$work/cache-module.log" >&2
            echo "Cache unexpectedly resolved as a specialist module." >&2
            exit 1
          fi

  released-module-lifecycle:
    name: "Released module lifecycle"
    needs: phpforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Verify specialist module lifecycle in exported skeleton
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          composer archive --format=tar --dir="$work" --file=infbyte
          mkdir "$work/project"
          tar -xf "$work/infbyte.tar" -C "$work/project"
          cd "$work/project"

          composer install --no-interaction --prefer-dist --no-progress
          php infbyte app:install

          php infbyte module:list --json=1 >"$work/modules.json"
          grep -q '"database"' "$work/modules.json"
          grep -q '"session"' "$work/modules.json"

          php infbyte module:plan database --json=1 >"$work/plan.json"
          grep -q '"infocyph/dblayer"' "$work/plan.json"

          php infbyte module:install database --json=1 >"$work/install.json"
          composer show infocyph/dblayer --no-interaction >/dev/null
          test -f config/database.php

          cp composer.json "$work/composer.direct.json"
          php -r '
            $path = "composer.json";
            $composer = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            unset($composer["require"]["infocyph/dblayer"]);
            file_put_contents($path, json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
          '
          php infbyte module:show database --json=1 >"$work/show-transitive.json"
          grep -q '"available":true' "$work/show-transitive.json"
          grep -q '"direct":false' "$work/show-transitive.json"
          grep -q '"transitive":true' "$work/show-transitive.json"
          grep -q '"ownership_unknown":false' "$work/show-transitive.json"

          printf '{invalid-json' > composer.json
          set +e
          php infbyte module:show database --json=1 >"$work/show-unknown.json" 2>"$work/show-unknown.err"
          ownership_status=$?
          set -e
          cat "$work/show-unknown.err" >>"$work/show-unknown.json"
          grep -q 'ownership_unknown' "$work/show-unknown.json"
          grep -q 'composer.json is invalid' "$work/show-unknown.json"
          if [[ "$ownership_status" -eq 0 ]]; then
            echo "Invalid root Composer metadata unexpectedly reported healthy module ownership." >&2
            exit 1
          fi
          cp "$work/composer.direct.json" composer.json

          set +e
          APP_CAPABILITIES=auth AUTH_STORAGE=database DB_CONNECTION=sqlite \
            php infbyte module:schema:status auth --connection=sqlite --json=1 >"$work/auth-schema-without-db-capability.json" 2>&1
          auth_schema_status=$?
          set -e
          if grep -qi 'database capability.*required\|enable.*database capability' "$work/auth-schema-without-db-capability.json"; then
            cat "$work/auth-schema-without-db-capability.json" >&2
            echo "Targeted auth schema inspection invented a database-capability prerequisite." >&2
            exit 1
          fi
          if [[ "$auth_schema_status" -eq 0 ]]; then
            grep -q '"schemas"' "$work/auth-schema-without-db-capability.json"
          else
            grep -q '"installed":false\|"state":"missing"\|"state":"unavailable"' "$work/auth-schema-without-db-capability.json"
          fi

          printf '\n// infbyte-owned-config-marker\n' >> config/database.php
          php infbyte module:config:publish database --json=1 >"$work/publish-existing.json"
          grep -q 'infbyte-owned-config-marker' config/database.php

          rm config/database.php
          php infbyte module:repair database --json=1 >"$work/repair.json"
          test -f config/database.php

          mkdir -p database
          touch database/database.sqlite

          php infbyte module:enable database --json=1 >"$work/enable.json"
          php infbyte module:show database --json=1 >"$work/show.json"
          grep -q '"direct":true' "$work/show.json"
          php infbyte module:doctor database --json=1 >"$work/doctor.json"

          php infbyte module:config:publish session --json=1 >"$work/session-config.json"
          test -f config/session.php

          set +e
          APP_CAPABILITIES=database,session SESSION_DRIVER=database DB_CONNECTION=sqlite \
            php infbyte module:schema:status session --json=1 >"$work/session-schema-before.json"
          session_schema_before=$?
          set -e
          if [[ "$session_schema_before" -eq 0 ]]; then
            cat "$work/session-schema-before.json" >&2
            echo "Database session schema unexpectedly reported ready before installation." >&2
            exit 1
          fi

          APP_CAPABILITIES=database,session SESSION_DRIVER=database DB_CONNECTION=sqlite \
            php infbyte module:schema:install session --json=1 >"$work/session-schema-install.json"
          APP_CAPABILITIES=database,session SESSION_DRIVER=database DB_CONNECTION=sqlite \
            php infbyte module:schema:status session --json=1 >"$work/session-schema-after.json"
          grep -q '"installed":true' "$work/session-schema-after.json"

          APP_CAPABILITIES=database,session SESSION_DRIVER=database DB_CONNECTION=sqlite \
            php infbyte module:schema:sync --json=1 >"$work/schema-sync.json"

          APP_CAPABILITIES=cache CACHE_STORE=sqlite \
            php infbyte cache:schema:status --json=1 >"$work/cache-schema-before.json"
          grep -q '"applicable":true' "$work/cache-schema-before.json"
          grep -q '"installed":true' "$work/cache-schema-before.json"

          APP_CAPABILITIES=cache CACHE_STORE=sqlite \
            php infbyte cache:schema:install --json=1 >"$work/cache-schema-install.json"
          grep -q '"installed":true' "$work/cache-schema-install.json"

          APP_CAPABILITIES=cache CACHE_STORE=sqlite \
            php infbyte cache:schema:status --json=1 >"$work/cache-schema-after.json"
          grep -q '"installed":true' "$work/cache-schema-after.json"

          php infbyte module:disable database --json=1 >"$work/disable.json"
          php infbyte module:remove database --dry-run --json=1 >"$work/remove-plan.json"
          php infbyte module:remove database --json=1 >"$work/remove.json"

          if composer show infocyph/dblayer --no-interaction >/dev/null 2>&1; then
            echo "DBLayer remained installed after specialist module removal." >&2
            exit 1
          fi

          test -f config/database.php

  released-auth-session:
    name: "Released production auth/session"
    needs: phpforge
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcntl, pdo_sqlite, redis, sodium
          tools: composer:v2
          coverage: none

      - name: Verify production auth and browser-session lifecycle
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          composer archive --format=tar --dir="$work" --file=infbyte
          mkdir "$work/project"
          tar -xf "$work/infbyte.tar" -C "$work/project"
          cd "$work/project"

          composer install --no-interaction --prefer-dist --no-progress
          php infbyte app:install

          php infbyte module:install database --json=1 >"$work/database-install.json"
          php infbyte module:install security --json=1 >"$work/security-install.json"
          php infbyte module:install communication --json=1 >"$work/communication-install.json"
          php infbyte module:install auth --feature=otp --json=1 >"$work/auth-install.json"
          php infbyte module:config:publish session --json=1 >"$work/session-config.json"

          mkdir -p database
          touch database/database.sqlite

          export APP_ENV=production
          export APP_DEBUG=false
          export APP_URL=https://infbyte.example.test
          export APP_CAPABILITIES=auth,cache,database,security,communication,session
          export DB_CONNECTION=sqlite
          export DB_DATABASE=database/database.sqlite
          export AUTH_STORAGE=database
          export AUTH_CACHE=cache
          export AUTH_PASSWORDS=native
          export AUTH_TOKENS=security
          export AUTH_MFA=otp
          export AUTH_NOTIFICATIONS=talkingbytes
          export AUTH_PASSKEY=disabled
          export CACHE_STORE=redis
          export CACHE_COUNTER=redis
          export CACHE_REDIS_DSN=redis://127.0.0.1:6379
          export CACHE_INTEGRITY_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          export AUTH_OTP_RECOVERY_HMAC_KEY="$(php -r 'echo bin2hex(random_bytes(32));')"
          export AUTH_OTP_MFA_KEY="$(php -r 'echo rtrim(strtr(base64_encode(random_bytes(32)), "+/", "-_"), "=");')"
          export AUTH_OTP_SECRET_PROTECTION_KEYS='[{"id":"ci-primary","environment":"AUTH_OTP_MFA_KEY","status":"active"}]'
          export NOTIFICATIONS_AUTH_TRANSPORT=log
          export SESSION_DRIVER=database
          export SESSION_DB_CONNECTION=sqlite
          export SESSION_LOCK_ENABLED=false

          php infbyte module:schema:install auth --connection=sqlite --json=1 >"$work/auth-schema.json"
          php infbyte module:schema:install session --connection=sqlite --json=1 >"$work/session-schema.json"
          grep -q '"installed":true' "$work/auth-schema.json"
          grep -q '"installed":true' "$work/session-schema.json"

          php infbyte config:validate --production
          php infbyte app:ready
          php infbyte optimize --json=1 >"$work/auth-release.json"

          php <<'PHP'
          <?php

          declare(strict_types=1);

          use Infocyph\Foundation\Auth\AuthServices;
          use Infocyph\Foundation\Auth\Authentication\Login\LoginRequest;
          use Infocyph\Foundation\Foundation;
          use Infocyph\Foundation\Session\BrowserSession;
          use Infocyph\Foundation\Session\SessionConfig;
          use Infocyph\Foundation\Session\SessionStoreFactory;

          require 'vendor/autoload.php';

          $app = Foundation::cli([
              'base_path' => getcwd(),
              '_config_cache' => false,
          ])->boot();

          $auth = $app->make(AuthServices::class);
          $password = 'production-auth-smoke-secret';
          $hash = $auth->passwordHasher()->hash($password);
          $created = $auth->accounts()->create('production-auth@example.test', $hash);

          if (!$created->successful() || $created->account === null) {
              fwrite(STDERR, "Production account creation failed.\n");
              exit(1);
          }

          $login = $auth->authenticator()->login(new LoginRequest(
              $created->account->identifier(),
              $password,
          ));
          if (!$login->successful() || $login->principal === null || $login->session === null) {
              fwrite(STDERR, "Production login/session issuance failed.\n");
              exit(1);
          }

          $oldAuthSessionId = $login->session->id;
          $rotated = $auth->sessions()->rotate($oldAuthSessionId);
          if ($rotated->id === $oldAuthSessionId || $auth->sessions()->touch($oldAuthSessionId) !== null) {
              fwrite(STDERR, "Auth session rotation did not retire the stale session id.\n");
              exit(1);
          }

          $auth->authenticator()->logout($login->principal, $rotated->id);
          if ($auth->sessions()->touch($rotated->id) !== null) {
              fwrite(STDERR, "Auth logout did not revoke the rotated session.\n");
              exit(1);
          }

          $sessionConfig = $app->make(SessionConfig::class);
          $storeFactory = $app->make(SessionStoreFactory::class);
          $browser = static fn(?string $candidateId): BrowserSession => new BrowserSession(
              $candidateId,
              fn() => $storeFactory->make(),
              static fn() => null,
              $sessionConfig,
          );

          $initial = $browser(null);
          $initial->put('account_id', $created->account->id());
          $initialCommit = $initial->commit(time());
          $initialId = $initialCommit->id;
          if (!is_string($initialId) || strlen($initialId) !== 64) {
              fwrite(STDERR, "Browser session issuance failed.\n");
              exit(1);
          }
          $initial->release();

          $current = $browser($initialId);
          if ($current->get('account_id') !== $created->account->id()) {
              fwrite(STDERR, "Browser session persistence failed.\n");
              exit(1);
          }
          $rotatedBrowserId = $current->regenerate();
          $current->commit(time());
          $current->release();

          if ($rotatedBrowserId === $initialId) {
              fwrite(STDERR, "Browser session regeneration reused the old id.\n");
              exit(1);
          }

          $stale = $browser($initialId);
          if ($stale->get('account_id') !== null) {
              fwrite(STDERR, "Stale browser session id retained authority after regeneration.\n");
              exit(1);
          }
          $stale->release();

          $active = $browser($rotatedBrowserId);
          if ($active->get('account_id') !== $created->account->id()) {
              fwrite(STDERR, "Regenerated browser session lost persisted state.\n");
              exit(1);
          }
          $active->invalidate();
          $invalidatedId = $active->commit(time())->id;
          $active->release();

          if (!is_string($invalidatedId) || $invalidatedId === $rotatedBrowserId) {
              fwrite(STDERR, "Browser session invalidation did not issue a clean id.\n");
              exit(1);
          }

          $revoked = $browser($rotatedBrowserId);
          if ($revoked->get('account_id') !== null) {
              fwrite(STDERR, "Invalidated browser session id remained usable.\n");
              exit(1);
          }
          $revoked->release();
          PHP

