          if ! grep -Eqi 'hash mismatch|cache.*mismatch|shard.*invalid|corrupt' "$work/sharded-tamper.log"; then
            cat "$work/sharded-tamper.log" >&2
            cat "$work/sharded-tamper-response" >&2 || true
            echo "Webrick rejected the tampered request without exposing a recognizable native cache-integrity failure." >&2
